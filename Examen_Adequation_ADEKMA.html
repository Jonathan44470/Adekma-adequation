<title>Examen Adéquation ADEKMA</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1a1a1a">

<link rel="apple-touch-icon" href="icons/icon-180.png">

<style>
  :root{
    --orange:#f5a623;
    --black:#1a1a1a;
    --bg:#f4f5f7;
    --card:#ffffff;
    --border:#dcdfe4;
    --accent:#1a1a1a;
    --focus:#f5a623;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg); color:#222; padding-bottom:60px;
  }
  header{
    display:flex; align-items:center; justify-content:space-between;
    background:var(--black); padding:14px 20px; position:sticky; top:0; z-index:50;
    box-shadow:0 2px 8px rgba(0,0,0,.25);
  }
  header img{height:34px; background:#fff; padding:6px 10px; border-radius:6px;}
  header h1{color:#fff; font-size:18px; margin:0; font-weight:600; letter-spacing:.5px;}
  .progress-wrap{padding:10px 20px 0; max-width:760px; margin:0 auto;}
  .progress-bar{height:6px; background:#e3e5e9; border-radius:3px; overflow:hidden;}
  .progress-fill{height:100%; background:var(--orange); width:0%; transition:width .25s ease;}
  .progress-label{font-size:12px; color:#666; margin-top:4px; text-align:right;}
  main{max-width:760px; margin:0 auto; padding:16px 20px 40px;}
  .card{
    background:var(--card); border:1px solid var(--border); border-radius:10px;
    padding:18px 18px 8px; margin-bottom:18px; box-shadow:0 1px 3px rgba(0,0,0,.04);
  }
  .card h2{
    font-size:14px; text-transform:uppercase; letter-spacing:.6px; color:var(--orange);
    margin:0 0 14px; border-bottom:2px solid #f1f1f1; padding-bottom:8px;
  }
  .field{margin-bottom:14px;}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  @media (max-width:600px){ .row2{grid-template-columns:1fr;} }
  label{display:block; font-size:13px; font-weight:600; margin-bottom:5px; color:#333;}
  input[type=text], input[type=date], input[type=tel], input[type=email], select, textarea{
    width:100%; padding:10px 12px; border:1.5px solid var(--border); border-radius:8px;
    font-size:15px; background:#fff; color:#222; font-family:inherit;
  }
  input:focus, select:focus, textarea:focus{
    outline:none; border-color:var(--focus); box-shadow:0 0 0 3px rgba(245,166,35,.25);
  }
  textarea{resize:vertical; min-height:56px;}
  .radio-group{display:flex; gap:18px; align-items:center; padding:6px 0;}
  .radio-opt{display:flex; align-items:center; gap:6px; font-size:15px;}
  .radio-opt input{width:20px; height:20px;}
  .hint{font-size:12px; color:#888; margin-top:4px;}
  canvas.sigpad{
    width:100%; height:100px; border:2px dashed var(--border); border-radius:8px;
    background:#fff; touch-action:none; display:block;
  }
  .sig-actions{display:flex; gap:10px; margin-top:8px;}
  button{
    font-family:inherit; cursor:pointer; border:none; border-radius:8px;
    font-size:14px; font-weight:600; padding:10px 16px;
  }
  .btn-secondary{background:#eceef1; color:#333;}
  .btn-secondary:hover{background:#e0e2e6;}
  .btn-primary{background:var(--orange); color:#1a1a1a;}
  .btn-primary:hover{background:#e6981a;}
  .btn-next{background:var(--black); color:#fff; width:100%; padding:12px; font-size:15px; margin-top:6px;}
  .btn-next:hover{background:#333;}
  .final-card{text-align:center;}
  .btn-generate{
    background:var(--orange); color:#1a1a1a; font-size:17px; padding:16px 24px;
    width:100%; border-radius:10px; box-shadow:0 3px 10px rgba(245,166,35,.4);
  }
  .btn-generate:disabled{background:#ddd; color:#999; box-shadow:none; cursor:not-allowed;}
  .step-note{font-size:12.5px; color:#999; margin-top:2px; margin-bottom:10px;}
  .signed-tag{
    display:inline-block; background:#e8f7ee; color:#1e7d3c; font-size:12px;
    padding:3px 10px; border-radius:20px; font-weight:600; margin-left:8px;
  }
  .filename-preview{
    font-size:12.5px; color:#666; margin-top:10px; word-break:break-all;
    background:#f7f7f8; border:1px dashed var(--border); padding:8px 10px; border-radius:6px;
  }
  .kbd{
    display:inline-block; border:1px solid #bbb; border-bottom-width:2px; border-radius:4px;
    padding:1px 6px; font-size:11px; background:#fafafa; font-family:monospace;
  }
</style>
</head>

<div class="progress-wrap">
  <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  <div class="progress-label" id="progressLabel">0 / 0 champs</div>

<main>
<form id="mainForm" autocomplete="off">

  <div class="card">
    <h2>Informations générales</h2>
    <div class="row2">
      <div class="field">
        <label for="date_visite">Date de la visite</label>
        <input type="date" id="date_visite" data-order="1">
      </div>
      <div class="field">
        <label for="code_site">Code site</label>
        <input type="text" id="code_site" data-order="2">
      </div>
    </div>
    <div class="row2">
      <div class="field">
        <label for="client">Client</label>
        <input type="text" id="client" data-order="3">
      </div>
      <div class="field">
        <label for="adresse">Adresse (société)</label>
        <input type="text" id="adresse" data-order="4">
      </div>
    </div>
    <div class="field">
      <label for="interlocuteur">Interlocuteur</label>
      <input type="text" id="interlocuteur" data-order="5">
    </div>
    <div class="row2">
      <div class="field">
        <label for="telephone">Téléphone</label>
        <input type="tel" id="telephone" data-order="6">
      </div>
      <div class="field">
        <label for="mail">Mail</label>
        <input type="email" id="mail" data-order="7">
      </div>
    </div>
    <div class="field">
      <label for="adresse_chantier">Adresse chantier (lieu)</label>
      <input type="text" id="adresse_chantier" data-order="8">
    </div>
    <div class="row2">
      <div class="field">
        <label for="date_operation">Date opération</label>
        <input type="text" id="date_operation" data-order="9">
      </div>
      <div class="field">
        <label for="duree_chantier">Durée du chantier</label>
        <input type="text" id="duree_chantier" data-order="10">
      </div>
    </div>
    <div class="field">
      <label for="nature_travaux">Nature des travaux</label>
      <textarea id="nature_travaux" rows="3" data-order="11"></textarea>
    </div>
  </div>

  <div class="card">
    <h2>Moyens</h2>
    <div class="row2">
      <div class="field">
        <label for="grue">Grue</label>
        <select id="grue" data-order="12">
          <option value=""></option>
          <option>LTM 40</option>
          <option>LTC 50</option>
          <option>LTM 60</option>
          <option>GMK 80</option>
          <option>LTM 100</option>
          <option>LTM 130</option>
          <option>LTM 230</option>
          <option>AC 300</option>
          <option value="__autre__">Autre (préciser)</option>
        </select>
      </div>
      <div class="field">
        <label for="plaque_calage">Plaque de calage</label>
        <input type="text" id="plaque_calage" data-order="13">
      </div>
    </div>
    <div class="field" id="grue_autre_wrap" style="display:none;">
      <label for="grue_autre">Préciser la grue</label>
      <input type="text" id="grue_autre" data-order="12.5">
    </div>
    <div class="row2">
      <div class="field">
        <label for="bras_grue">Bras de grue</label>
        <input type="text" id="bras_grue" data-order="14">
      </div>
      <div class="field">
        <label for="plaques_roulage">Plaques de roulage</label>
        <input type="text" id="plaques_roulage" data-order="15">
      </div>
    </div>
    <div class="row2">
      <div class="field">
        <label for="nacelle">Nacelle</label>
        <select id="nacelle" data-order="16">
          <option value=""></option>
          <option>PL-51 m</option>
          <option>PL-65 m</option>
          <option value="__autre__">Autre (préciser)</option>
        </select>
      </div>
      <div class="field">
        <label for="calage_supp">Calage supplémentaire</label>
        <input type="text" id="calage_supp" data-order="17">
      </div>
    </div>
    <div class="field" id="nacelle_autre_wrap" style="display:none;">
      <label for="nacelle_autre">Préciser la nacelle</label>
      <input type="text" id="nacelle_autre" data-order="16.5">
    </div>
    <div class="field">
      <label for="apparaux">Apparaux</label>
      <input type="text" id="apparaux" data-order="18">
    </div>
    <div class="field">
      <label>Arrêté de voirie</label>
      <div class="radio-group" data-order="19" id="grp_arrete_voirie">
        <label class="radio-opt"><input type="radio" name="arrete_voirie" value="oui"> Oui</label>
        <label class="radio-opt"><input type="radio" name="arrete_voirie" value="non"> Non</label>
      </div>
    </div>
    <div class="field">
      <label for="arrete_voirie_commentaire">Commentaire</label>
      <input type="text" id="arrete_voirie_commentaire" data-order="20">
    </div>
    <div class="field">
      <label for="autres_moyens">Autres</label>
      <textarea id="autres_moyens" rows="2" data-order="21"></textarea>
    </div>
  </div>

  <div class="card">
    <h2>Mesures de levage</h2>
    <div class="row2">
      <div class="field">
        <label for="portee">Portée</label>
        <input type="text" id="portee" data-order="22" placeholder="m">
      </div>
      <div class="field">
        <label for="poids">Poids</label>
        <input type="text" id="poids" data-order="23" placeholder="kg">
      </div>
    </div>
    <div class="row2">
      <div class="field">
        <label for="hsc">HSC</label>
        <input type="text" id="hsc" data-order="24">
      </div>
      <div class="field">
        <label for="hauteur">Hauteur</label>
        <input type="text" id="hauteur" data-order="25" placeholder="m">
      </div>
    </div>
    <div class="field">
      <label for="charge_panier">Charge au panier</label>
      <input type="text" id="charge_panier" data-order="26" placeholder="kg">
    </div>
    <div class="field">
      <label>Ligne aérienne</label>
      <div class="radio-group" data-order="27" id="grp_ligne_aerienne">
        <label class="radio-opt"><input type="radio" name="ligne_aerienne" value="oui"> Oui</label>
        <label class="radio-opt"><input type="radio" name="ligne_aerienne" value="non"> Non</label>
      </div>
    </div>
    <div class="field">
      <label for="autres_mesures">Autres</label>
      <textarea id="autres_mesures" rows="2" data-order="28"></textarea>
    </div>
  </div>

  <div class="card">
    <h2>Observations</h2>
    <div class="field">
      <textarea id="observations" rows="3" data-order="29"></textarea>
    </div>
  </div>

  <div class="card">
    <h2>Signature ADEKMA</h2>
    <div class="field">
      <label for="nom_adekma">Nom interlocuteur ADEKMA</label>
      <input type="text" id="nom_adekma" data-order="30">
    </div>
    <div class="field">
      <label>Signature ADEKMA <span id="tag_adekma"></span></label>
      <canvas class="sigpad" id="sig_adekma"></canvas>
      <div class="sig-actions">
        <button type="button" class="btn-secondary" onclick="clearSig('sig_adekma')">Effacer</button>
      </div>
    </div>
    <button type="button" class="btn-next" id="btn_to_client">Valider et passer au client →</button>
  </div>

  <div class="card" id="card_client" style="display:none;">
    <h2>Signature Client</h2>
    <div class="step-note">C'est maintenant au client de vérifier son nom et de signer ci-dessous.</div>
    <div class="field">
      <label for="nom_client">Nom interlocuteur Client</label>
      <input type="text" id="nom_client" data-order="31">
    </div>
    <div class="field">
      <label>Signature Client <span id="tag_client"></span></label>
      <canvas class="sigpad" id="sig_client"></canvas>
      <div class="sig-actions">
        <button type="button" class="btn-secondary" onclick="clearSig('sig_client')">Effacer</button>
      </div>
    </div>
  </div>

  <div class="card final-card" id="card_final" style="display:none;">
    <h2 style="border:none;">Terminé</h2>
    <button type="button" class="btn-generate" id="btn_generate">Générer et télécharger le PDF</button>
    <div class="filename-preview" id="filenamePreview"></div>
  </div>

</form>

/* ---------- Enter-to-next navigation ---------- */
const orderedEls = Array.from(document.querySelectorAll('[data-order]'))
  .sort((a,b)=> (+a.dataset.order) - (+b.dataset.order));

function focusableOf(el){
  if(el.tagName === 'DIV'){ // radio group wrapper
    const checked = el.querySelector('input:checked');
    return checked || el.querySelector('input');
  }
  return el;
}

function isVisible(el){
  return !!(el.offsetParent !== null || el.offsetWidth || el.offsetHeight);
}

function goToIndex(idx){
  if(idx >= orderedEls.length){ return; }
  const container = orderedEls[idx];
  if(!isVisible(container)){ goToIndex(idx+1); return; }
  const target = focusableOf(container);
  if(target){
    target.focus({preventScroll:true});
    target.scrollIntoView({behavior:'smooth', block:'center'});
  }
  updateProgress();
}

function indexOfElement(el){
  // find the data-order container that holds el
  for(let i=0;i<orderedEls.length;i++){
    if(orderedEls[i] === el || orderedEls[i].contains(el)) return i;
  }
  return -1;
}

document.getElementById('mainForm').addEventListener('keydown', function(e){
  if(e.key !== 'Enter') return;
  const tag = e.target.tagName;
  if(tag === 'TEXTAREA' && !e.shiftKey){
    e.preventDefault();
  } else if(tag === 'TEXTAREA' && e.shiftKey){
    return; // allow newline
  } else {
    e.preventDefault();
  }
  const idx = indexOfElement(e.target);
  if(idx >= 0) goToIndex(idx+1);
});

// auto-advance on radio selection
document.querySelectorAll('input[type=radio]').forEach(r=>{
  r.addEventListener('change', function(){
    const idx = indexOfElement(this);
    setTimeout(()=>goToIndex(idx+1), 150);
    updateProgress();
  });
});

// select dropdown -> Enter/close also advances (change event covers tap selection)
document.querySelectorAll('select').forEach(s=>{
  s.addEventListener('change', updateProgress);
});
document.querySelectorAll('input, textarea').forEach(el=>{
  el.addEventListener('input', updateProgress);
});

// "Autre" option reveals a free-text field for Grue / Nacelle
function setupAutreOption(selectId, wrapId, inputId){
  const sel = document.getElementById(selectId);
  const wrap = document.getElementById(wrapId);
  sel.addEventListener('change', function(){
    if(this.value === '__autre__'){
      wrap.style.display = 'block';
      document.getElementById(inputId).focus({preventScroll:true});
      document.getElementById(inputId).scrollIntoView({behavior:'smooth', block:'center'});
    } else {
      wrap.style.display = 'none';
      document.getElementById(inputId).value = '';
    }
    updateProgress();
  });
}
setupAutreOption('grue', 'grue_autre_wrap', 'grue_autre');
setupAutreOption('nacelle', 'nacelle_autre_wrap', 'nacelle_autre');

/* ---------- progress bar ---------- */
function updateProgress(){
  let total = 0, filled = 0;
  orderedEls.forEach(el=>{
    if(!isVisible(el)) return; // skip hidden "Autre" fields
    total++;
    if(el.tagName === 'DIV'){
      if(el.querySelector('input:checked')) filled++;
    } else if(el.value && el.value.trim() !== ''){
      filled++;
    }
  });
  const pct = total ? Math.round(filled/total*100) : 0;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressLabel').textContent = filled + ' / ' + total + ' champs';
}

/* ---------- default date ---------- */
window.addEventListener('DOMContentLoaded', ()=>{
  const d = new Date();
  const iso = d.toISOString().slice(0,10);
  document.getElementById('date_visite').value = iso;
  updateProgress();
});

/* ---------- signature pads ---------- */
const padResizers = {};
function setupPad(id){
  const canvas = document.getElementById(id);
  const ctx = canvas.getContext('2d');
  function resize(){
    const ratio = window.devicePixelRatio || 1;
    const rect = canvas.getBoundingClientRect();
    if(rect.width === 0 || rect.height === 0) return; // hidden, skip until visible
    canvas.width = rect.width * ratio;
    canvas.height = rect.height * ratio;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.scale(ratio, ratio);
    ctx.lineWidth = 2.2;
    ctx.lineCap = 'round';
    ctx.strokeStyle = '#1a1a1a';
  }
  resize();
  padResizers[id] = resize;
  let drawing = false, last = null;
  function pos(e){
    const rect = canvas.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return {x: clientX-rect.left, y: clientY-rect.top};
  }
  function start(e){ drawing = true; last = pos(e); e.preventDefault(); canvas.dataset.signed='1'; updateTags(); }
  function move(e){
    if(!drawing) return;
    const p = pos(e);
    ctx.beginPath(); ctx.moveTo(last.x,last.y); ctx.lineTo(p.x,p.y); ctx.stroke();
    last = p; e.preventDefault();
  }
  function end(){ drawing = false; }
  canvas.addEventListener('mousedown', start);
  canvas.addEventListener('mousemove', move);
  window.addEventListener('mouseup', end);
  canvas.addEventListener('touchstart', start, {passive:false});
  canvas.addEventListener('touchmove', move, {passive:false});
  canvas.addEventListener('touchend', end);
}
function clearSig(id){
  const canvas = document.getElementById(id);
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0,0,canvas.width, canvas.height);
  canvas.dataset.signed = '';
  updateTags();
  checkFinal();
}
setupPad('sig_adekma');
setupPad('sig_client');

function updateTags(){
  document.getElementById('tag_adekma').textContent = document.getElementById('sig_adekma').dataset.signed ? '✓ signé' : '';
  document.getElementById('tag_client').textContent = document.getElementById('sig_client').dataset.signed ? '✓ signé' : '';
  checkFinal();
}

document.getElementById('btn_to_client').addEventListener('click', ()=>{
  document.getElementById('card_client').style.display = 'block';
  if(padResizers['sig_client']) padResizers['sig_client']();
  document.getElementById('card_client').scrollIntoView({behavior:'smooth', block:'start'});
  document.getElementById('nom_client').focus({preventScroll:true});
});

// Filet de sécurité : si la fenêtre est redimensionnée pendant que le pavé client est visible
window.addEventListener('resize', ()=>{
  if(document.getElementById('card_client').style.display !== 'none' && padResizers['sig_client']){
    padResizers['sig_client']();
  }
});

function checkFinal(){
  const adekmaSigned = !!document.getElementById('sig_adekma').dataset.signed;
  const clientSigned = !!document.getElementById('sig_client').dataset.signed;
  const finalCard = document.getElementById('card_final');
  if(clientSigned){
    finalCard.style.display = 'block';
  }
  updateFilenamePreview();
}

// observe canvas signed attribute changes via mutation on drawing (call after each stroke end)
['mouseup','touchend'].forEach(evt=>{
  document.getElementById('sig_client').addEventListener(evt, ()=>{ updateTags(); });
  document.getElementById('sig_adekma').addEventListener(evt, ()=>{ updateTags(); });
});

/* ---------- filename ---------- */
function sanitize(s){
  return (s||'').toString().trim().replace(/[\/\\:\*\?"<>\|]/g,'-');
}
function buildFilename(){
  const client = sanitize(document.getElementById('client').value) || 'Client';
  const code = sanitize(document.getElementById('code_site').value) || 'CodeSite';
  const lieu = sanitize(document.getElementById('adresse_chantier').value) || 'Lieu';
  return `Adéquation ADEKMA-${client}-${code}-${lieu}.pdf`;
}
function updateFilenamePreview(){
  document.getElementById('filenamePreview').textContent = 'Nom du fichier : ' + buildFilename();
}
['client','code_site','adresse_chantier'].forEach(id=>{
  document.getElementById(id).addEventListener('input', updateFilenamePreview);
});

/* ---------- PDF generation ---------- */
document.getElementById('btn_generate').addEventListener('click', generatePDF);

function val(id){ return document.getElementById(id).value || ''; }
function radioVal(name){
  const r = document.querySelector(`input[name=${name}]:checked`);
  return r ? r.value : '';
}
function grueValue(){
  const sel = document.getElementById('grue').value;
  return sel === '__autre__' ? val('grue_autre') : sel;
}
function nacelleValue(){
  const sel = document.getElementById('nacelle').value;
  return sel === '__autre__' ? val('nacelle_autre') : sel;
}

function generatePDF(){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({unit:'pt', format:'a4'});
  const PAGE_H = 842, PAGE_W = 595;

  doc.addImage(TEMPLATE_BG_DATA_URL, 'PNG', 0, 0, PAGE_W, PAGE_H);
  doc.setFont('helvetica','bold');
  doc.setTextColor(15, 70, 165);

  // jsPDF utilise une origine en HAUT à gauche (comme le template lu top-down) :
  // pas besoin d'inverser l'axe Y, "top"/"bottom" sont déjà dans le bon sens.
  function baselineY(bottom){ return bottom - 2.6; }

  // Petit retrait (tabulation) entre le bord de la zone et le texte inséré
  const TAB = 12;

  // Efface les petits points imprimés de la zone (systématique, que le champ soit rempli ou non)
  function whiteout(x0, x1, top, bottom){
    doc.setFillColor(255, 255, 255);
    doc.rect(x0 - 1, top - 0.5, (x1 - x0) + 2, (bottom - top) + 1, 'F');
  }

  function put(text, x0, x1, top, bottom, opts){
    opts = opts || {};
    whiteout(x0, x1, top, bottom);
    if(!text) return;
    doc.setFontSize(opts.size || 9.5);
    doc.text(String(text), x0 + TAB, baselineY(bottom), opts.maxWidth ? {maxWidth:opts.maxWidth} : undefined);
  }

  function putWrapped(text, slots, opts){
    // slots: [{x0,x1,top,bottom}, ...] - remplit les créneaux dans l'ordre, avec retour à la ligne
    opts = opts || {};
    // Nettoie systématiquement tous les créneaux, même si le champ est vide
    for(const slot of slots){ whiteout(slot.x0, slot.x1, slot.top, slot.bottom); }
    if(!text) return;
    doc.setFontSize(opts.size || 9);
    let remaining = text;
    for(const slot of slots){
      if(!remaining) break;
      const w = slot.x1 - slot.x0 - TAB;
      const lines = doc.splitTextToSize(remaining, w);
      const line = lines.shift();
      doc.text(line, slot.x0 + TAB, baselineY(slot.bottom));
      remaining = lines.join(' ');
    }
  }

  function markChoice(value, boxOui, boxNon){
    const box = value === 'oui' ? boxOui : (value === 'non' ? boxNon : null);
    if(!box) return;
    const cx = (box.x0 + box.x1)/2, cy = (box.top + box.bottom)/2;
    const rx = (box.x1-box.x0)/2 + 3, ry = (box.bottom-box.top)/2 + 3;
    doc.setDrawColor(200,40,30);
    doc.setLineWidth(1.3);
    doc.ellipse(cx, cy, rx, ry, 'S');
  }

  // ---- En-tête ----
  const dateVisite = val('date_visite');
  const dateVisiteFr = dateVisite ? dateVisite.split('-').reverse().join('/') : '';
  put(dateVisiteFr, 106, 191, 57, 67);
  put(val('code_site'), 353, 418, 57, 67);
  put(val('client'), 64, 172, 73, 84);
  put(val('adresse'), 346, 554, 73, 84);
  put(val('interlocuteur'), 95, 292, 90, 100);
  put(val('telephone'), 84, 166, 106, 116);
  put(val('mail'), 331, 390, 106, 116);
  put(val('adresse_chantier'), 109, 294, 122, 133);
  put(val('date_operation'), 103, 200, 139, 149);
  put(val('duree_chantier'), 390, 446, 139, 149);

  putWrapped(val('nature_travaux'), [
    {x0:116.6, x1:548, top:153.7, bottom:163.9},
    {x0:30, x1:546, top:170, bottom:180},
    {x0:30, x1:546, top:186, bottom:196},
    {x0:30, x1:546, top:202, bottom:212},
  ]);

  // ---- Moyens ----
  put(grueValue(), 61, 187, 235, 246);
  put(val('plaque_calage'), 388, 552, 235, 246);
  put(val('bras_grue'), 97, 277, 252, 262);
  put(val('plaques_roulage'), 386, 553, 252, 262);
  put(nacelleValue(), 74, 202, 268, 279);

  markChoice(radioVal('arrete_voirie'),
    {x0:386.5, x1:399.5, top:268, bottom:278.2},
    {x0:417.3, x1:433.4, top:268, bottom:278.2});
  put(val('arrete_voirie_commentaire'), 438, 553, 268, 279, {size:7.5});

  put(val('calage_supp'), 138, 277, 284, 295);
  putWrapped(val('autres_moyens'), [
    {x0:345, x1:553, top:284, bottom:295},
    {x0:303, x1:553, top:299, bottom:311},
  ], {size:8.5});
  put(val('apparaux'), 83, 275, 300, 311);

  // ---- Mesures ----
  put(val('portee'), 36, 95, 333, 344);
  put(val('poids'), 36, 95, 366, 376);
  put(val('hsc'), 36, 95, 399, 409);
  put(val('hauteur'), 36, 95, 431, 442);
  put(val('charge_panier'), 36, 95, 476, 487);

  markChoice(radioVal('ligne_aerienne'),
    {x0:46.7, x1:59.7, top:521.5, bottom:531.6},
    {x0:68.3, x1:84.4, top:521.5, bottom:531.6});

  putWrapped(val('autres_mesures'), [
    {x0:37, x1:95, top:554, bottom:564},
    {x0:37, x1:95, top:570, bottom:581},
    {x0:37, x1:95, top:587, bottom:597},
    {x0:37, x1:95, top:603, bottom:613},
    {x0:37, x1:95, top:619, bottom:630},
    {x0:37, x1:95, top:636, bottom:646},
    {x0:37, x1:95, top:652, bottom:662},
    {x0:37, x1:95, top:668, bottom:679},
    {x0:37, x1:95, top:685, bottom:695},
  ], {size:7.5});

  // ---- Observations ----
  putWrapped(val('observations'), [
    {x0:95.5, x1:494, top:704.3, bottom:714.5},
    {x0:30, x1:546, top:720, bottom:731},
    {x0:30, x1:546, top:737, bottom:747},
  ]);

  // ---- Bas de page ----
  put(val('nom_client'), 114, 279, 770, 780);
  put(val('nom_adekma'), 389, 461, 770, 780);

  // Insère une signature SANS la déformer : elle est mise à l'échelle en conservant
  // ses proportions réelles (contain), puis centrée dans la zone disponible.
  function drawSignature(canvasId, boxX, boxY, boxW, boxH){
    try{
      const canvas = document.getElementById(canvasId);
      if(!canvas.dataset.signed) return;
      const srcW = canvas.width, srcH = canvas.height;
      if(!srcW || !srcH) return;
      const scale = Math.min(boxW / srcW, boxH / srcH);
      const drawW = srcW * scale;
      const drawH = srcH * scale;
      const dx = boxX + (boxW - drawW) / 2;
      const dy = boxY + (boxH - drawH) / 2;
      const data = canvas.toDataURL('image/png');
      doc.addImage(data, 'PNG', dx, dy, drawW, drawH);
    }catch(e){}
  }

  const sigTop = 798, sigBottom = 823;
  const sigH = sigBottom - sigTop;
  drawSignature('sig_client', 32, sigTop, 260, sigH);
  drawSignature('sig_adekma', 305, sigTop, 258, sigH);

  doc.save(buildFilename());
}
